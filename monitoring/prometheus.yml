# Prometheus Configuration for ML System Monitoring
# =====================================================

global:
  # How frequently to scrape targets
  scrape_interval: 15s
  
  # How frequently to evaluate alert rules
  evaluation_interval: 15s
  
  # Labels to attach to any time series or alerts
  external_labels:
    cluster: 'mlops-local'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules from files
rule_files:
  - '/etc/prometheus/alert_rules.yml'

# Scrape configurations
scrape_configs:
  
  # ====================
  # Prometheus itself
  # ====================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'
  
  # ====================
  # ML Prediction API
  # ====================
  - job_name: 'mlops-api'
    scrape_interval: 10s  # More frequent for API
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8000']  # API on host
        labels:
          service: 'prediction-api'
          tier: 'application'
          component: 'api'
    
    # Relabel to add custom labels
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mlops-api'
  
  # ====================
  # ML Training Service (if running separately)
  # ====================
  - job_name: 'mlops-training'
    scrape_interval: 30s  # Less frequent for training
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          service: 'training-service'
          tier: 'ml-pipeline'
          component: 'training'
    
    # Optional: Only scrape when service is available
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mlops-training'
  
  # ====================
  # Self-Healing Orchestrator (if exposed)
  # ====================
  - job_name: 'mlops-orchestrator'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8002']
        labels:
          service: 'orchestrator'
          tier: 'ml-pipeline'
          component: 'orchestration'
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'mlops-orchestrator'
  
  # ====================
  # Node Exporter (System Metrics)
  # ====================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          tier: 'infrastructure'
  
  # ====================
  # cAdvisor (Container Metrics)
  # ====================
  - job_name: 'cadvisor'
    scrape_interval: 10s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
          tier: 'infrastructure'
  
  # ====================
  # Grafana
  # ====================
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          tier: 'monitoring'

# Storage configuration is set via command-line flags in docker-compose.yml:
# --storage.tsdb.retention.time=30d
# --storage.tsdb.retention.size=10GB
